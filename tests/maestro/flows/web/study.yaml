# Maestro E2E Test: Study Screen
# Task 8.8a - Client Testing Agent
# 
# Tests study screen display and interactions

url: "http://localhost:3000"
---
# Launch and navigate to study
# Wait (handled by assertions)
- runFlow: home.yaml

# Verify study screen elements
- assertVisible:
    id: "study_screen"

# Content generation loading state (when content is missing)
- assertVisible:
    text: "טוען תוכן..."

# Verify source text (Mishnah) is displayed
- assertVisible:
    id: "mishna_text"

# Verify AI explanation is displayed
- assertVisible:
    id: "explanation_text"

# Verify done button exists
- assertVisible:
    id: "done_button"

# Finishing a mishna opens the next one on the same page (no trip back to the path)
- tapOn:
    id: "done_button"

# The next mishna and its done button are now the ones being studied
- assertVisible:
    id: "mishna_text"

- assertVisible:
    id: "done_button"

# Notes (explanation, opinions, expansions, halakha) are part of the page, not a separate section
- assertVisible:
    id: "explanation_text"

- killApp
